<section>

<h1>Kurser</h1>

<input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" placeholder="Sök kurs...">

<table>

    <thead>
        <tr>
            <th (click)="setSortField('courseCode')">Kurskod</th>
            <th (click)="setSortField('courseName')">Kursnamn</th>
            <th (click)="setSortField('progression')">Progression</th>
        </tr>
    </thead>

    <tbody>

        @if (loading()) {

        <p>Laddar kurser...</p>

        } @else {

        @for (course of filteredCourses(); track course.courseCode) {
        <tr>
            <td>{{ course.courseCode }}</td>

            <td>
                <a [href]="course.syllabus" target="_blank">{{ course.courseName }}</a>
            </td>

            <td>{{ course.progression }}</td>

        </tr>
        }
        @empty {
        <tr>
            <td colspan="3">Inga kurser hittades...</td>
        </tr>
        }

        }

    </tbody>

</table>

</section>
